defaults:
  - base_dataset

dataset_dir: data/airhockey-1m
train_split: train
val_split: valid
horizon: 16
val_horizon: 16
aug_mode: none
skip_frame: 1
pad_after: 7
pad_before: 1
seed: 42
skip_idx: 4
use_cache: true
resolution: 128
obs_keys: [top_pov]
low_dim_keys: []
goal_sample: intermediate
shape_meta:
  action:
    shape:
    - 4
  obs:
    top_pov:
      shape:
      - 3 # C
      - 128 # H
      - 128 # W
      type: rgb
